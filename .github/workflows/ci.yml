name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # vxedge-api is a git dependency on the private vxedge repo (Cargo.toml) — cargo's own
      # git fetching needs authenticated https for that host, same pattern vxperiments' own
      # cross-repo CI job already uses (docs/TASKS.md #18). Requires VXEDGE_CROSS_REPO_TOKEN
      # to be added to *this* repo's own secrets (repo-scoped, not inherited from vxperiments'
      # — a human/admin action, not done by this workflow file existing).
      - name: Configure git for the private vxedge-api dependency
        run: |
          git config --global url."https://${{ secrets.VXEDGE_CROSS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # vxedge-api's build.rs regenerates the tonic bindings from proto/ at compile time even
      # when consumed as a git dependency (same as compiling it in-tree) — needs protoc.
      # Matches vxedge/.github/workflows/ci.yml's own "Install protoc" step exactly.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No git-config step here: cargo-deny-action runs in its own Docker container
      # (action.yml: `runs.using: docker`),
      # which does NOT inherit the runner's global ~/.gitconfig — a `git config --global` step
      # here (as the `rust` job above uses) silently has no effect inside it, confirmed by
      # comparing the two jobs' failure logs (the `rust` job's URL rewrite took effect, this
      # job's did not). The action ships its own `credentials` input instead: its
      # `entrypoint.sh` writes this value verbatim as one line into $HOME/.git-credentials
      # inside the container and enables `credential.helper store`. The action's own README
      # (not just entrypoint.sh) spells out the required shape: a real `user:pass` pair, not a
      # bare token — a token-only value (no colon) writes to the file but git's
      # credential-store lookup still fails to match it (confirmed live: first attempt with
      # `https://TOKEN@github.com` still failed with "failed to acquire username/password from
      # local configuration" even though the secret substitution itself worked). GitHub
      # accepts any non-empty username alongside a PAT as the password, so the literal
      # placeholder `x-access-token` works here.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          credentials: "https://x-access-token:${{ secrets.VXEDGE_CROSS_REPO_TOKEN }}@github.com"
